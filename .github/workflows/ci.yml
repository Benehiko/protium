name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # v2, not v1: from 0.14.1 on Zig's tarballs are named
      # `zig-<arch>-<os>-<version>`, and v1 still asks for the old
      # `zig-<os>-<arch>` name, which 404s on every mirror.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: format
        run: zig fmt --check .
      - name: build
        run: zig build
      - name: test
        run: zig build test
      # The shape `make package` ships: ReleaseSafe, stripped, aarch64-macos.
      # Built here so a release never discovers it broke.
      - name: release build
        run: make check-release
