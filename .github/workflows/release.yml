name: release

# Pushing a `v*` tag builds, signs and publishes a release. The steps are the
# Makefile's (`package`, `sign`, `notes`), so they can be tried by hand; this
# file supplies the machine, the permissions and the upload.
# docs/releasing.md says how to cut one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      # Create the release and upload to it.
      contents: write
      # Let the job ask GitHub for an OIDC token. cosign trades it for a
      # short-lived certificate naming this workflow; nothing is stored.
      id-token: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the next step can ask whether the tag is on
          # main.
          fetch-depth: 0

      # checkout fetches a tag by commit, which leaves a lightweight tag and
      # loses the message the release notes are made from. Fetch the tag
      # object itself.
      - name: annotated tag
        run: git fetch --force origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"

      # A tag on a branch nobody reviewed would still be signed as this
      # workflow, so refuse it.
      - name: tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$VERSION does not point at a commit on main" >&2
            exit 1
          }

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The tag is the version: it is passed to the build as -Dversion.
      - name: package
        run: make package VERSION="$VERSION"

      - name: sign
        run: make sign VERSION="$VERSION"

      - name: notes
        run: make notes VERSION="$VERSION"

      - name: publish
        run: |
          gh release create "$VERSION" --verify-tag --title "protium $VERSION" \
            --notes-file dist/notes.md \
            dist/protium-"$VERSION"-*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
