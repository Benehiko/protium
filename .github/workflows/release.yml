name: release

# Pushing a `v*` tag builds, signs and publishes a release. The steps are the
# Makefile's (`package`, `sums`, `sign`, `notes`), so they can be tried by
# hand; this file supplies the machines, the permissions and the upload.
# docs/releasing.md says how to cut one.
#
# Three jobs: check the tag, build the Wine runtime (wine-build.yml), then
# package protium with that runtime's SHA-256 compiled in and publish both,
# with the runtime's sources, under one signed SHA256SUMS.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag on a branch nobody reviewed would still be signed as this workflow,
  # so refuse it before anything is built.
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tag is on main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$VERSION does not point at a commit on main" >&2
            exit 1
          }

  runtime:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/wine-build.yml

  release:
    needs: [tag, runtime]
    runs-on: macos-15
    permissions:
      # Create the release and upload to it.
      contents: write
      # Let the job ask GitHub for an OIDC token. cosign trades it for a
      # short-lived certificate naming this workflow; nothing is stored.
      id-token: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checkout fetches a tag by commit, which leaves a lightweight tag and
      # loses the message the release notes are made from. Fetch the tag
      # object itself.
      - name: annotated tag
        run: git fetch --force origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      # Pinned to a commit: this action puts the signing tool on the machine,
      # and cosign-installer publishes no moving `v4` tag to follow anyway.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # What the runtime job built: the runtime, and its source archives.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime
          path: runtime-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-sources
          path: runtime-dist

      # The tag is the version, passed to the build as -Dversion. The runtime's
      # SHA-256 goes in as -Druntime_sha256, which is what lets `protium runtime
      # install` accept that archive and nothing else.
      - name: package
        run: |
          set -- runtime-dist/*-macos-x86_64.tar.gz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one runtime archive, found: $*" >&2; exit 1; }
          make package VERSION="$VERSION" RUNTIME_SHA256="$(shasum -a 256 "$1" | cut -d' ' -f1)"
          cp runtime-dist/* dist/
          make sums

      - name: sign
        run: make sign VERSION="$VERSION"

      - name: notes
        run: make notes VERSION="$VERSION"

      # A tag with a hyphen, such as v0.2.0-rc1, is a pre-release: published
      # and downloadable, but never shown as the latest release.
      - name: publish
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" --verify-tag $pre --title "protium $VERSION" \
            --notes-file dist/notes.md \
            dist/*.tar.* dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
