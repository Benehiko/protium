name: wine-build

# Builds the Wine runtime from an empty root, exactly as `protium build` does on
# someone's Mac, and checks what came out. This is the first half of shipping a
# prebuilt runtime: it proves the recipe runs on a machine nobody prepared, on
# the oldest macOS the runtime supports (macos-15, see `recipe.macos_min`).
#
# It uploads two artifacts: `runtime`, the runtime with every licence text it
# needs inside it, and `runtime-sources`, the exact source archives it was
# built from. release.yml calls this workflow and publishes both. Run on its
# own, it keeps them for a week.
#
# It runs on demand, when a release calls it, and on pull requests that change
# what the runtime is made of. A build takes a long time, so it does not run on
# every change.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - src/recipe.zig
      - patches/**
      - .github/workflows/wine-build.yml

permissions:
  contents: read

jobs:
  build:
    # A newer push to a pull request supersedes the build still running for
    # it. The paths filter compares the whole pull request with its base, so
    # every push to one that touches the runtime starts a build. Only pull
    # request builds are cancelled: a build for a release, or one started by
    # hand, has a group of its own and always finishes.
    concurrency:
      group: wine-build-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Apple silicon. protium refuses an Intel Mac (src/doctor.zig).
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # Wine is x86-64 and its configure runs what it compiles, so the build
      # needs Rosetta. Install it if the image does not already have it.
      - name: rosetta
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: protium
        run: |
          zig build -Doptimize=ReleaseSafe
          echo "PROTIUM_HOME=$RUNNER_TEMP/protium" >> "$GITHUB_ENV"
          sw_vers

      # Everything: the four libraries in deps, bison, llvm-mingw, CrossOver's
      # sources, Wine, and the install. Each download is refused unless it
      # matches the SHA-256 the recipe pins.
      - name: build
        run: ./zig-out/bin/protium build

      - name: check the runtime
        run: |
          set -eu
          set -- "$PROTIUM_HOME"/runtimes/*/
          [ "$#" -eq 1 ] || { echo "expected one runtime, found $#: $*" >&2; exit 1; }
          rt=${1%/}
          echo "runtime: $rt"
          echo "RUNTIME=$(basename "$rt")" >> "$GITHUB_ENV"

          # No Mach-O may ask for a macOS newer than the oldest one supported.
          # LC_BUILD_VERSION says `minos`; the older LC_VERSION_MIN_MACOSX,
          # which Wine's loader uses, says `version`.
          max_major=15 max_minor=0 bad=0 count=0
          while IFS= read -r f; do
            v=$(otool -l "$f" | awk '$1=="minos"{print $2; exit} $1=="cmd" && $2=="LC_VERSION_MIN_MACOSX"{m=1} m && $1=="version"{print $2; exit}')
            [ -n "$v" ] || { echo "no minimum macOS in $f" >&2; bad=1; continue; }
            major=${v%%.*} rest=${v#*.} minor=${rest%%.*}
            count=$((count + 1))
            if [ "$major" -gt "$max_major" ] || { [ "$major" -eq "$max_major" ] && [ "$minor" -gt "$max_minor" ]; }; then
              echo "too new: $f wants macOS $v" >&2; bad=1
            fi
          done < <(find -H "$rt" -type f \( -name '*.so' -o -name '*.dylib' -o -perm -u+x \) -exec file {} + | grep 'Mach-O' | cut -d: -f1)
          echo "Mach-O files checked: $count"
          # Explicit: `set -e` does not stop on a failed `&&` list, so a
          # check written as `[ … ] && [ … ]` would pass having found nothing.
          if [ "$count" -eq 0 ]; then echo "no Mach-O files found in $rt" >&2; exit 1; fi
          if [ "$bad" -ne 0 ]; then exit 1; fi

          # The bundled libraries are x86-64 and refer only to each other.
          for lib in libfreetype.6 libgnutls.30 libnettle.8 libhogweed.6 libgmp.10; do
            f="$rt/lib/$lib.dylib"
            [ "$(lipo -archs "$f")" = "x86_64" ] || { echo "$f is not x86_64" >&2; exit 1; }
            ! otool -L "$f" | grep -F "$PROTIUM_HOME/deps" || { echo "$f still names deps" >&2; exit 1; }
          done
          [ "$(lipo -archs "$rt/bin/wine")" = "x86_64" ]

      # Packaged and uploaded before the smoke test, so that a runtime that
      # built and passed its checks can be downloaded and tried on a real Mac
      # even when the runner cannot boot it. That is how a failure of the
      # runtime is told apart from a failure of the runner.
      # Every licence text the runtime's contents ask to travel with them, from
      # the source trees the build left in $PROTIUM_HOME/build. Which applies to
      # what is THIRD-PARTY-NOTICES.md. Each expected file is required, so a
      # missing one fails the build instead of shipping without it.
      - name: licences
        run: |
          set -eu
          b="$PROTIUM_HOME/build"; l="$PROTIUM_HOME/runtimes/$RUNTIME/licenses"
          mkdir -p "$l/wine" "$l/wine-libs" "$l/deps"
          cp "$b/wine/COPYING.LIB" "$b/wine/LICENSE" "$b/wine/AUTHORS" "$l/wine/"
          for n in capstone compiler-rt faudio fluidsynth gsm jpeg jxr lcms2 ldap mpg123 musl png tiff tomcrypt vkd3d xml2 xslt zlib; do
            mkdir -p "$l/wine-libs/$n"
            find "$b/wine/libs/$n" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'COPYRIGHT*' \) -exec cp {} "$l/wine-libs/$n/" \;
            [ -n "$(ls "$l/wine-libs/$n")" ] || { echo "no licence file for libs/$n" >&2; exit 1; }
          done
          for d in "$b"/freetype-*/ "$b"/gnutls-*/ "$b"/nettle-*/ "$b"/gmp-*/; do
            n=$(basename "$d"); mkdir -p "$l/deps/$n"
            for f in LICENSE LICENSE.TXT COPYING COPYING.LESSERv3 COPYINGv2 COPYINGv3 AUTHORS docs/FTL.TXT docs/GPLv2.TXT; do
              if [ -f "$d$f" ]; then cp "$d$f" "$l/deps/$n/"; fi
            done
            [ -n "$(ls "$l/deps/$n")" ] || { echo "no licence file for $n" >&2; exit 1; }
          done
          [ "$(ls "$l/deps" | wc -l)" -eq 4 ] || { echo "expected four libraries in deps" >&2; exit 1; }
          cat > "$l/README.txt" <<'EOF'
          Licence texts for what this runtime contains. THIRD-PARTY-NOTICES.md in
          protium says which applies to what.

            wine/       Wine itself: LGPL-2.1-or-later (COPYING.LIB), and its authors
            wine-libs/  the libraries Wine links into its own DLLs, one directory each
            deps/       FreeType, GnuTLS, Nettle (libnettle, libhogweed) and GMP,
                        copied into lib/

          This software is based in part on the work of the Independent JPEG Group.

          The exact source archives this runtime was built from are published with
          the protium release it came with, and listed in that release's SHA256SUMS.
          EOF
          find "$l" -type f | sed "s|$l/||" | sort

      - name: package
        run: tar -C "$PROTIUM_HOME/runtimes" -czf "$RUNNER_TEMP/$RUNTIME-macos-x86_64.tar.gz" "$RUNTIME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime
          path: ${{ runner.temp }}/${{ env.RUNTIME }}-macos-x86_64.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      # The source archives the runtime was built from, exactly as fetched and
      # checked against the recipe's pins: CrossOver's tree, which carries Wine
      # and the libraries it links in, and the four libraries in deps. Build
      # tools (bison, llvm-mingw) are not in the runtime and are not here.
      - name: sources
        run: |
          set -eu
          b="$PROTIUM_HOME/build"; s="$RUNNER_TEMP/sources"; mkdir -p "$s"
          for p in 'crossover-sources-*.tar.gz' 'freetype-*.tar.*' 'gnutls-*.tar.*' 'nettle-*.tar.*' 'gmp-*.tar.*'; do
            set -- $(find "$b" -maxdepth 1 -name "$p")
            [ "$#" -eq 1 ] || { echo "expected one $p in $b, found $#" >&2; exit 1; }
            cp "$1" "$s/"
          done
          ls -l "$s"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-sources
          path: ${{ runner.temp }}/sources/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      # The runtime boots a prefix and runs a Windows program. No D3DMetal:
      # that is Apple's, and is never part of this.
      #
      # Bounded: on 2026-10-01 `prefix new` hung on the runner after Wine's
      # `run_wineboot boot event wait timed out`, and held the job for forty
      # minutes until it was cancelled. Locally the same step takes seconds.
      #
      # Why it hung, from the diagnostics step's process list: `wineboot
      # --init` had started `control.exe appwiz.cpl install_mono`, Wine's
      # "download Wine Mono?" dialog, and was waiting for an answer nobody on a
      # runner gives. A Mac that has answered it once keeps the installer in
      # ~/.cache/wine and never sees the dialog again, which is why the step
      # never hung locally.
      #
      # The runner has no ~/.cache, so this step is the test of `protium prefix
      # new` fetching Wine Mono itself (`recipe.wine_mono`): it fails if the
      # prefix has no Mono. Gecko is kept off with `mshtml=`. protium does not
      # fetch it, and `cmd /c ver` does not need it.
      - name: smoke test
        timeout-minutes: 10
        env:
          WINEDLLOVERRIDES: mshtml=
        run: |
          ./zig-out/bin/protium prefix new ci --force
          test -d "$PROTIUM_HOME/prefixes/ci/drive_c/windows/mono/mono-2.0"
          WINEDEBUG=-all ./zig-out/bin/protium run --prefix ci cmd /c ver | tee "$RUNNER_TEMP/ver.txt"
          grep -q 'Microsoft Windows' "$RUNNER_TEMP/ver.txt"

          # .NET programs run on that Mono. Wine Mono's own C# compiler is a
          # .NET program, and what it compiles must exit with the 42 it
          # returns. Output goes to files, not pipes: a pipe from `protium
          # run` has been seen to stay open after mcs.exe exited.
          hello="$PROTIUM_HOME/prefixes/ci/drive_c/hello"
          mkdir -p "$hello"
          printf '%s\n' 'class Hello { static int Main() { System.Console.WriteLine("hello from .NET " + System.Environment.Version); return 42; } }' > "$hello/hello.cs"
          WINEDEBUG=-all ./zig-out/bin/protium run --prefix ci 'C:\windows\mono\mono-2.0\lib\mono\4.5\mcs.exe' '-out:C:\hello\hello.exe' 'C:\hello\hello.cs' > "$RUNNER_TEMP/mcs.txt" 2>&1 \
            || { cat "$RUNNER_TEMP/mcs.txt"; exit 1; }
          code=0
          WINEDEBUG=-all ./zig-out/bin/protium run --prefix ci 'C:\hello\hello.exe' > "$RUNNER_TEMP/hello.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/hello.txt"
          if [ "$code" -ne 42 ]; then echo "hello.exe exited $code, not 42" >&2; exit 1; fi
          grep -q 'hello from .NET' "$RUNNER_TEMP/hello.txt"

      # What was still running when the smoke test failed or timed out, and
      # what the prefix got as far as.
      - name: smoke test diagnostics
        if: failure()
        run: |
          echo "== Wine processes"
          ps -axo pid,ppid,etime,stat,command | grep -i -E 'wine|\.exe' | grep -v grep || true
          echo "== the prefix"
          ls -la "$PROTIUM_HOME/prefixes/ci" 2>&1 || true
          ls "$PROTIUM_HOME/prefixes/ci/drive_c/windows" 2>&1 | head -20 || true
          echo "== session"
          who || true
          launchctl managername 2>&1 || true
